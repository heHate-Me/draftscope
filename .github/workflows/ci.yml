name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-safety:
    name: Publication safety
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Reject unsafe tracked content
        run: python tools/check_publication_safety.py

  unittest:
    name: Python ${{ matrix.python-version }}
    needs: publication-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test tooling
        run: python -m pip install '.[test]'

      - name: Run tests with branch coverage
        if: matrix.python-version == '3.11'
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Enforce and report coverage
        if: matrix.python-version == '3.11'
        run: |
          python -m coverage report
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml

      - name: Upload coverage report
        if: success() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.11
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run tests
        if: matrix.python-version != '3.11'
        run: python -m unittest discover -s tests -v

  package:
    name: Build and install distributions
    needs: publication-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release tooling
        run: python -m pip install '.[release]'

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install and smoke-test wheel
        run: |
          python -m venv "$RUNNER_TEMP/draftscope-wheel"
          "$RUNNER_TEMP/draftscope-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/draftscope-wheel/bin/draftscope" --help

      - name: Install and smoke-test source distribution
        run: |
          python -m venv "$RUNNER_TEMP/draftscope-sdist"
          "$RUNNER_TEMP/draftscope-sdist/bin/python" -m pip install --no-deps dist/*.tar.gz
          "$RUNNER_TEMP/draftscope-sdist/bin/draftscope" --help
